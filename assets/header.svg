<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0D121F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glowing Cyan/Purple Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
      <animate attributeName="x1" from="0%" to="100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Orb Blur -->
    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .star { animation: starTwinkle 3s ease-in-out infinite alternate; }
    .star-2 { animation: starTwinkle 2s ease-in-out infinite alternate 1s; }
    .star-3 { animation: starTwinkle 4s ease-in-out infinite alternate 0.5s; }
    @keyframes starTwinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.4); }
    }
    .pulse-dot {
      animation: dotPulse 1.8s infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; r: 4px; }
      50% { opacity: 0.3; r: 2.5px; }
    }
    .laser-beam {
      animation: laserTravel 3.5s linear infinite;
    }
    @keyframes laserTravel {
      0% { transform: translateX(-850px); }
      100% { transform: translateX(850px); }
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="848" height="218" rx="16" fill="url(#bgGrad)" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Glowing Orbs inside Card -->
  <circle cx="180" cy="50" r="90" fill="#00F0FF" fill-opacity="0.12" filter="url(#orbBlur)" />
  <circle cx="680" cy="170" r="110" fill="#A855F7" fill-opacity="0.15" filter="url(#orbBlur)" />

  <!-- Animated Stars -->
  <circle cx="80" cy="45" r="1.5" fill="#00F0FF" class="star" />
  <circle cx="760" cy="60" r="2" fill="#A855F7" class="star-2" />
  <circle cx="240" cy="180" r="1.5" fill="#38BDF8" class="star-3" />
  <circle cx="620" cy="40" r="1.5" fill="#E879F9" class="star" />
  <circle cx="130" cy="140" r="2" fill="#00F0FF" class="star-2" />
  <circle cx="710" cy="130" r="1.5" fill="#00F0FF" class="star-3" />

  <!-- Top Pill Badge -->
  <g transform="translate(195, 28)">
    <rect x="0" y="0" width="460" height="28" rx="14" fill="url(#pillGrad)" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#00F0FF" class="pulse-dot" filter="url(#glow)" />
    <text x="32" y="18" fill="#00F0FF" class="pill-text">SYSTEMS ARCHITECT &amp; TECHNICAL PRODUCT BUILDER</text>
  </g>

  <!-- Main Name Header -->
  <text x="425" y="112" text-anchor="middle" fill="url(#textGrad)" class="main-title" filter="url(#glow)">MUHAMMED SHEFIN</text>

  <!-- Subtitle Matrix -->
  <g transform="translate(425, 150)">
    <text text-anchor="middle" fill="#CBD5E1" class="sub-text">
      <tspan fill="#00F0FF" font-weight="bold">⚡</tspan> FULL-STACK GENERALIST
      <tspan fill="#A855F7">  •  </tspan>
      <tspan fill="#A855F7" font-weight="bold">🤖</tspan> WAMAX MESSAGING ENGINE
      <tspan fill="#00F0FF">  •  </tspan>
      <tspan fill="#38BDF8" font-weight="bold">🐳</tspan> DEVOPS &amp; LINUX INFRA
    </text>
  </g>

  <!-- Secondary Meta Bar -->
  <g transform="translate(425, 178)">
    <text text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" letter-spacing="1">
      <tspan fill="#34D399">● PRODUCTION READY</tspan>   │   FOUNDER @ WYWK.IN   │   KERALA, INDIA
    </text>
  </g>

  <!-- Animated Neon Laser Bottom Line -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="1" y="214" width="848" height="4" rx="2" />
    </clipPath>
    <rect x="0" y="215" width="850" height="3" fill="#07090E" />
    <rect x="0" y="215" width="400" height="3" fill="url(#neonGrad)" class="laser-beam" />
  </g>
</svg>
