<svg width="850" height="48" viewBox="0 0 850 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Purple Filter -->
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Coral Filter -->
    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
    }
    .radar-core {
      animation: pulseCore 1.6s ease-in-out infinite;
    }
    .radar-ring {
      animation: pulseRing 1.6s ease-out infinite;
    }
    @keyframes pulseCore {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes pulseRing {
      0% { r: 3px; opacity: 0.9; }
      100% { r: 9px; opacity: 0; }
    }
    .pill-box {
      transition: all 0.3s ease;
    }
  </style>

  <!-- ==================== PILL 1: STATUS ==================== -->
  <g transform="translate(10, 2)">
    <rect x="0" y="0" width="245" height="44" rx="22" fill="url(#pillBg)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.2" />
    
    <!-- Radar Animation -->
    <g transform="translate(24, 22)">
      <circle cx="0" cy="0" r="4" fill="#00F0FF" class="radar-core" filter="url(#glowCyan)" />
      <circle cx="0" cy="0" r="8" stroke="#00F0FF" stroke-width="1.2" fill="none" class="radar-ring" />
    </g>

    <text x="42" y="26" class="font-mono">
      <tspan fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1.5">STATUS</tspan>
      <tspan fill="#334155" font-size="11"> │ </tspan>
      <tspan fill="#00F0FF" font-size="11.5" font-weight="800" letter-spacing="1">SYSTEMS ACTIVE</tspan>
    </text>
  </g>

  <!-- ==================== PILL 2: ROLE ==================== -->
  <g transform="translate(265, 2)">
    <rect x="0" y="0" width="345" height="44" rx="22" fill="url(#pillBg)" stroke="#A855F7" stroke-opacity="0.35" stroke-width="1.2" />
    
    <!-- Server / Tech Icon -->
    <g transform="translate(22, 16)">
      <rect x="0" y="0" width="12" height="4" rx="1" fill="#A855F7" />
      <rect x="0" y="5" width="12" height="4" rx="1" fill="#C084FC" />
      <rect x="0" y="10" width="12" height="4" rx="1" fill="#E879F9" />
      <circle cx="9" cy="2" r="0.8" fill="#34D399" />
      <circle cx="9" cy="7" r="0.8" fill="#34D399" />
      <circle cx="9" cy="12" r="0.8" fill="#34D399" />
    </g>

    <text x="44" y="26" class="font-mono">
      <tspan fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1.5">ROLE</tspan>
      <tspan fill="#334155" font-size="11"> │ </tspan>
      <tspan fill="#E879F9" font-size="11.5" font-weight="800" letter-spacing="0.8">SYSTEMS &amp; INFRASTRUCTURE</tspan>
    </text>
  </g>

  <!-- ==================== PILL 3: LOCATION ==================== -->
  <g transform="translate(620, 2)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="url(#pillBg)" stroke="#FF7B72" stroke-opacity="0.35" stroke-width="1.2" />
    
    <!-- Map Pin Icon -->
    <g transform="translate(22, 14)">
      <path d="M6 0C2.69 0 0 2.69 0 6C0 10.5 6 15 6 15C6 15 12 10.5 12 6C12 2.69 9.31 0 6 0ZM6 8C4.9 8 4 7.1 4 6C4 4.9 4.9 4 6 4C7.1 4 8 4.9 8 6C8 7.1 7.1 8 6 8Z" fill="#FF7B72" filter="url(#glowCoral)" />
    </g>

    <text x="44" y="26" class="font-mono">
      <tspan fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1.5">BASE</tspan>
      <tspan fill="#334155" font-size="11"> │ </tspan>
      <tspan fill="#FF7B72" font-size="11.5" font-weight="800" letter-spacing="1">KERALA, INDIA</tspan>
    </text>
  </g>
</svg>
